# Known defect set — NÃO é ground truth absoluta.
#
# São os defeitos distintos que reviews independentes acharam no snapshot
# `fiado` e que EU verifiquei manualmente no código, um a um. O conjunto
# CRESCE: quando um review acha algo real que ninguém tinha achado e a
# verificação confirma, o defeito entra aqui e `known_total` sobe.
#
# Histórico:
#   14 — união dos dois reviews-piloto (ver docs/COMPARACAO-JUSTA.md), ambos
#        limitados a 10 achados pelo protocolo
#   +3 — b-1, a primeira execução com teto de 20: isenção de X-API-Key num
#        namespace inteiro, regras de SQL só cobertas por teste que pula sem
#        Postgres, e ramo 401 inalcançável
#   +1 — a-2: colunas de customers buscadas e descartadas
#   +2 — b-2: caminhos de erro de auth sem cobertura na rota, e casos de
#        borda (pagamento em excesso, customer_id nulo) nunca exercitados
#
# Que o primeiro review com teto folgado tenha acrescentado 3 confirma que
# este conjunto é um PISO, não um teto. Recall medido contra ele é otimista.

snapshot:
  repo: pdv-feat-baseline
  base_commit: 4ae137b8c83fe102447e5a1a04e0d95df2b53180
  feature: "GET /api/v1/customers/{id}/fiado"
  archive: snapshot.tar.gz

known_total: 20

defects:
  - id: sqlc-not-generated
    severity: high
    file: packages/api-go/query/fiado.sql
    title: "sqlc não regenerado; go build ./... quebra"
    detail: >
      As três queries novas nunca passaram por `sqlc generate`: não existe
      internal/db/fiado.sql.go e querier.go não tem os métodos. O pacote não
      compila.
    # "sqlc" sozinho casava com `sqlc.arg(customer_id)`, que aparece em
    # achados sobre a query e nada tem a ver com a geração não ter rodado.
    match_any: ["sqlc generate", "sqlc nao foi regenerado", "sqlc não foi regenerado",
                "fiado.sql.go", "undefined: db.", "não compila", "nao compila", "go build"]

  - id: payments-subquery-unfiltered
    severity: med
    file: packages/api-go/query/fiado.sql
    title: "subquery de payments sem predicado agrega a tabela inteira"
    detail: >
      O LEFT JOIN usa SELECT sale_id, SUM(amount) FROM payments GROUP BY
      sale_id sem WHERE. Agrega todos os tenants a cada request.
    match_any: ["subquery", "sub-query", "sem predicado", "sem filtro", "tabela inteira", "full scan", "todos os tenants", "GROUP BY sale_id"]

  - id: tenant-isolation-untested
    severity: med
    file: packages/api-go/internal/db/fiado_integration_test.go
    title: "isolamento multi-tenant da listagem nunca exercitado"
    detail: >
      O teste cria otherUserID/otherCustomerID e comenta que o isolamento
      importa, mas nunca semeia vendas para eles nem assere. Remover
      s.user_id = $1 da SQL deixaria tudo verde.
    match_any: ["otheruser", "othercustomer", "isolamento", "isolation", "multi-tenant", "multitenant", "vazamento"]

  - id: error-discarded-no-wrap-no-log
    severity: med
    file: packages/api-go/internal/fiado/pending.go
    title: "internalError descarta o erro original: sem %w e sem log"
    detail: >
      Todo erro de banco vira apperror.New genérico. Sem %w, sem log, e o
      handler também não loga. 500 sem rastro.
    match_any: ["internalerror", "%w", "sem log", "não loga", "nao loga", "erro original", "indiagnosticável", "indiagnosticavel"]

  - id: fallback-branch-uncovered
    severity: med
    file: packages/api-go/internal/handler/fiado.go
    title: "ramo de fallback não-AppError nunca exercitado"
    detail: >
      writeFiadoFailure tem um caminho para erro que não é *apperror.AppError,
      mas o teste injeta um AppError, então errors.As sempre casa.
    # "ramo" sozinho é genérico demais: casava também com o ramo 401 de
    # CustomerFiado, que é outro defeito. Critério agora exige o símbolo.
    match_any: ["fallback", "errors.as", "não-apperror", "nao-apperror", "writefiadofailure", "internal_error"]

  - id: numericfloat-swallows-error
    severity: med
    file: packages/api-go/internal/fiado/pending.go
    title: "numericFloat engole erro e NULL retornando 0"
    detail: >
      if err != nil || !f.Valid { return 0 }. Valor monetário errado vai para
      o cliente como 200/0.00 em vez de 500.
    match_any: ["numericfloat", "numeric_float"]

  - id: timestamptz-validity-discarded
    severity: low
    file: packages/api-go/internal/fiado/pending.go
    title: "validade do timestamptz descartada (saleDate, _ :=)"
    detail: >
      O bool de validade é ignorado; SaleDate inválido serializa como
      0001-01-01T00:00:00Z em vez de erro ou null.
    match_any: ["timestamptz", "saledate", "0001-01-01"]

  - id: error-contract-divergence
    severity: low
    file: packages/api-go/internal/handler/fiado.go
    title: "dois formatos de erro no mesmo endpoint"
    detail: >
      Middleware Bearer responde {error,code} via apperror; o handler responde
      {success,message,code}. O cliente precisa parsear dois shapes.
    match_any: ["dois formatos", "contrato de erro", "success/message", "success\", \"message", "apperror.writejson", "divergente", "inconsistente conforme"]

  - id: pagination-contract-untested
    severity: low
    file: packages/api-go/internal/handler/fiado_router_test.go
    title: "teste de contrato não desce em pagination; items[0] sem guard"
    detail: >
      TestCustomerFiado_responseKeys checa as chaves de topo e data[0] mas
      nunca page/limit/total/total_pages. E indexa items[0] sem checar len.
    match_any: ["pagination", "total_pages", "totalpages", "responsekeys", "items[0]"]

  - id: no-transaction-summary-list
    severity: low
    file: packages/api-go/internal/fiado/pending.go
    title: "summary e listagem são duas queries fora de transação"
    detail: >
      Se um pagamento quitar uma venda entre as duas chamadas, Pagination e
      total_devido ficam inconsistentes com Data.
    match_any: ["transação", "transacao", "transaction", "duas queries", "snapshot consistente", "atômic", "atomic"]

  - id: page-offset-int32
    severity: low
    file: packages/api-go/internal/fiado/types.go
    title: "Page.Offset converte para int32 sem checagem; invariante burlável"
    detail: >
      int32((p.Number-1)*p.Limit) só é seguro pelo invariante de NewPage, mas
      Page tem campos exportados e é construído direto nos testes.
    match_any: ["offset", "int32", "overflow", "maxpage", "newpage"]

  - id: vacuous-assertion-invalidparams
    severity: low
    file: packages/api-go/internal/handler/fiado_router_test.go
    title: "asserção vazia em TestCustomerFiado_invalidParams"
    detail: >
      `if lister.gotCustomerID != 0` nunca falha porque customerIDParam
      retorna 0 em entrada inválida. Precisa de um campo `called bool`.
    match_any: ["gotcustomerid", "invalidparams", "asserção vazia", "assercao vazia", "vacuous", "called bool", "nunca falha"]

  - id: desktop-parity-coalesce
    severity: low
    file: packages/api-go/query/fiado.sql
    title: "divergência de paridade com o desktop: COALESCE vs IS NULL"
    detail: >
      desktop sale_repository.rs:198 usa (p.total_paid IS NULL OR p.total_paid
      < s.total); a API usa COALESCE(p.total_paid,0) < s.total. Divergem para
      venda com total <= 0 e sem pagamento.
    match_any: ["paridade", "parity", "sale_repository", "desktop", "is null or"]

  # --- descobertos em b-1 (teto de achados em 20), verificados no código ---

  - id: bearer-exempts-whole-namespace
    severity: med
    file: packages/api-go/internal/middleware/routes.go
    title: "isenção de X-API-Key aplicada a um namespace versionado inteiro"
    detail: >
      As outras entradas de bearerRoutePrefixes são rotas específicas
      (/sync/, /invoices/, /notas/, /auth/me). A nova é /api/v1/customers/,
      um namespace inteiro: qualquer rota futura montada sob ele herda a
      isenção sem decisão explícita. Verificado em routes.go:17-23.
    match_any: ["bearerrouteprefixes", "namespace", "isenta", "isencao", "x-api-key", "/api/v1/customers/"]

  - id: sql-rules-only-in-skippable-test
    severity: med
    file: packages/api-go/internal/db/fiado_integration_test.go
    title: "regras de negócio do fiado só cobertas por teste que pula sem Postgres"
    detail: >
      is_credit/status/COALESCE(total_paid)/ORDER BY só são exercitados no
      teste de integração, e testutil.OpenDB faz t.Skip sem TEST_DATABASE_URL.
      Os unitários usam stubStore e nunca avaliam SQL. No CI padrão a
      cobertura dessas exclusões é zero. Verificado em
      testutil/db_integration.go:28 e fiado/pending_test.go:23.
    match_any: ["t.skip", "test_database_url", "opendb", "stubstore", "sem postgres", "cobertura efetiva"]

  - id: unauth-branch-unreachable
    severity: low
    file: packages/api-go/internal/handler/fiado.go
    title: "ramo 401 UNAUTHENTICATED inalcançável e sem teste"
    detail: >
      CustomerFiado trata `userID, ok := auth.UserIDFromContext(...)` com 401
      quando !ok, mas MountFiado sempre aplica apimw.Bearer (fiado_router.go:21),
      que aborta antes ou injeta o userID. Nenhum teste monta o handler sem o
      middleware. Verificado no código.
    match_any: ["unauthenticated", "useridfromcontext", "inalcancavel", "inalcançável", "codigo morto", "código morto"]

  - id: customer-columns-fetched-unused
    severity: low
    file: packages/api-go/query/fiado.sql
    title: "GetCustomerByUserIDAndID traz todas as colunas e o chamador descarta"
    detail: >
      A query faz SELECT de 10 colunas de customers, mas ListPending usa
      `if _, err := s.store.GetCustomerByUserIDAndID(...)` — só o erro
      importa, para decidir o 404. Um SELECT 1 / EXISTS diria a intenção e
      evitaria a transferência. Verificado em fiado.sql:5-11 e pending.go:35.
    match_any: ["descarta o resultado", "select 1", "colunas de customers", "10 colunas", "so usa o erro", "só usa o erro"]

  - id: auth-error-paths-untested
    severity: low
    file: packages/api-go/internal/handler/fiado_router_test.go
    title: "só o token ausente é testado na rota fiado"
    detail: >
      TestCustomerFiado_requiresBearerToken cobre apenas token ausente. Token
      malformado, expirado e usuário inexistente (apperror.InvalidToken /
      UserNotFound no middleware Bearer) não têm cobertura, apesar de serem os
      caminhos infelizes reais da nova rota. Verificado: zero menções a
      InvalidToken/UserNotFound no arquivo.
    match_any: ["requiresbearertoken", "token malformado", "expirado", "invalidtoken",
                "usernotfound", "usuario inexistente", "usuário inexistente"]

  - id: boundary-cases-untested
    severity: low
    file: packages/api-go/internal/db/fiado_integration_test.go
    title: "pagamento em excesso e customer_id nulo nunca exercitados"
    detail: >
      Sem caso de SUM(amount) > total nem de venda com customer_id NULL, o
      filtro COALESCE(p.total_paid,0) < s.total e o cast
      sqlc.arg(customer_id)::INT nunca são testados nos limites. O teste
      também semeia um produto que nenhuma asserção usa.
    match_any: ["pagamento em excesso", "sum(amount) > total", "customer_id null",
                "nos limites", "nesses limites", "nenhuma assercao usa", "nenhuma asserção usa"]

  - id: single-letter-params
    severity: low
    file: packages/api-go/internal/fiado/pending.go
    title: "parâmetros de uma letra violam RULES.md (t reservado para *testing.T)"
    detail: >
      `n pgtype.Numeric`, `f`, `t pgtype.Timestamptz`. .cursor/rules/RULES.md:56
      proíbe nomes de uma letra e reserva t para *testing.T.
    match_any: ["uma letra", "single-letter", "single letter", "naming", "nomes de variáve", "nomes de variave", "rules.md"]
